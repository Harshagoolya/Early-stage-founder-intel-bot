name: Founder Intel Agent

on:
  schedule:
    - cron: "0 9 * * 2"   # Tuesday 09:00 UTC
    - cron: "0 9 * * 5"   # Friday 09:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore agent state
        uses: actions/cache@v4
        with:
          path: agent_state.json
          key: agent-state-${{ github.run_id }}
          restore-keys: |
            agent-state-

      - name: Run agent
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:       ${{ secrets.TAVILY_API_KEY }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from agent import run_agent; run_agent()"

      - name: Save agent state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: agent_state.json
          key: agent-state-${{ github.run_id }}
